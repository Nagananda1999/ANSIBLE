baseLimits: &baseLimits
  cpu: "500m"
  memory: "512Mi"

dev:
  limits:
    <<: *baseLimits

test:
  limits:
    <<: *baseLimits
    cpu: "750m"

prod:
  limits:
    <<: *baseLimits
    cpu: "2"
    memory: "4Gi"

